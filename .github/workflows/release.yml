name: Release

# 打 tag(v*) 触发:三平台矩阵构建 + 签名 + 发 Release + 合并 latest.json。
# 用法:`git tag v0.4.0 && git push origin v0.4.0`(详见 README「发布」章节)。
#
# 三平台矩阵(macos-latest / ubuntu-22.04 / windows-latest,照搬 cc-one 已验证方案):
#  - 各平台 runner 上 tauri-action@v0.5.20 构建安装包 + Ed25519 签名(.sig),
#    上传到同一 Release;latest.json 由各平台合并为全平台更新清单
#  - 安装包内置的 npm 离线缓存(@deepseek-ai/dsh 依赖树)由每平台各自的
#    beforeBuildCommand 生成:原生可选依赖(如 esbuild)按构建机平台解析,
#    三平台缓存各得其所——这正是 #16 约定 + #24 矩阵化的语义
#  - Ubuntu 需装 WebKitGTK 等 Linux 构建依赖;macOS runner 为 Apple Silicon
#    (aarch64);updater 的 installMode 仅 Windows 有意义(NSIS passive),
#    macOS/Linux 走 updater 插件默认形态

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon (arm64)
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # Note: the `corepack` input was removed from setup-node@v4;
          # corepack is enabled explicitly in the step below instead.

      - name: Enable Corepack (pinned Yarn 4)
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: yarn install

      - name: Extract changelog for this release
        # Pull this tag's section out of CHANGELOG.md → GitHub Release body.
        # tauri-action copies the Release body into the updater's latest.json
        # `notes`, shown in the in-app UpdateCard. shell: bash so the heredoc
        # works on the Windows runner too.
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/extract-changelog.mjs > body.md
          # Write a multi-line GITHUB_ENV value with printf so the closing
          # delimiter always sits on its own line even if body.md lacks a
          # trailing newline (extract-changelog.mjs trims its output).
          printf 'RELEASE_BODY<<CHANGELOG_EOF\n' >> "$GITHUB_ENV"
          cat body.md >> "$GITHUB_ENV"
          printf '\nCHANGELOG_EOF\n' >> "$GITHUB_ENV"

      - name: Build and publish
        # Pinned to v0.5.20 as a known-good baseline (same as the reference
        # project cc-one). Auto-update also requires
        # bundle.createUpdaterArtifacts: true in tauri.conf.json — without it
        # Tauri emits no signed updater artifact and the action skips latest.json
        # ("Signature not found for the updater JSON"). Re-evaluate on a bump.
        # 安装包内置 npm 离线缓存由 beforeBuildCommand
        # (yarn web:build && node scripts/prepare-npm-cache.mjs)生成,随
        # bundle.resources 打进安装包。
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 签名密钥(见 #5):tauri-action 为每个安装包生成 .sig、
          # 组装 latest.json 更新清单并随 Release 发布。对应公钥在
          # tauri.conf.json(plugins.updater.pubkey);私钥 + 密码在仓库
          # Secrets 中 —— 打 tag 前须先设置(见 README「发布」章节)。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DeepSeek Desktop ${{ github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          # 各平台更新形态:Windows 就地升级优先 NSIS(带 npm-cache 的安装包);
          # macOS/Linux 由 updater 插件消费默认产物(app.tar.gz / deb 等)。
          updaterJsonPreferNsis: true
