[package]
name = "deepseek-desktop"
version = "0.5.0"
description = "DeepSeek Desktop — minimal Tauri shell."
authors = ["deepseek desktop"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deepseek_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sys-locale = "0.3"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
# registry 直查(#2 调研:3-5s 超时静默失败,比较 dist-tags.latest)。
# feature 集与 tauri-plugin-updater 已编译的 reqwest 对齐(rustls-no-provider + json),
# 不引入新的编译单元;TLS provider 由 upgrade.rs 启动时安装(rustls ring,插件同款)。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", features = ["ring"] }
